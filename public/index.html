<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17112e">
  <meta name="description" content="Le party game entre potes : Qui de nous, Tier List et Top Meme.">
  <title>Entre Potes — le party game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
</head>
<body>
  <div class="connection-banner" id="connection-banner" role="status" hidden>Connexion perdue… reconnexion en cours</div>

  <main class="app">
    <!-- Accueil -->
    <section class="screen" data-screen="home">
      <header class="hero">
        <h1 class="logo">Entre <span>Potes</span></h1>
        <p class="tagline">Le party game qui règle enfin les débats.</p>
      </header>

      <p class="invite-banner" id="invite-banner" hidden></p>

      <div class="card">
        <label class="field">
          <span>Ton pseudo</span>
          <input id="name-input" type="text" maxlength="20" autocomplete="nickname" placeholder="Ex : Maxime" enterkeyhint="go">
        </label>
      </div>

      <h2 class="section-title">Choisis ton mode</h2>
      <div class="modes" id="mode-cards"></div>

      <button class="btn btn-primary btn-big" id="create-btn" type="button">Créer une partie</button>

      <div class="divider"><span>ou rejoins tes potes</span></div>
      <div class="join-row">
        <input id="code-input" class="code-input" type="text" maxlength="5" placeholder="CODE"
               autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"
               aria-label="Code de la partie" enterkeyhint="go">
        <button class="btn btn-secondary" id="join-btn" type="button">Rejoindre</button>
      </div>
    </section>

    <!-- Lobby / partie : contenu généré par js/app.js -->
    <section class="screen" data-screen="game" hidden>
      <div id="game-view"></div>
    </section>
  </main>

  <!-- Footer : version + nouveautés (contenu lu depuis version.json) -->
  <footer class="site-footer">
    <div class="version-pill">
      <span class="version-label" id="version-label">v…</span>
      <button class="info-btn" id="version-info-btn" type="button" aria-label="Voir les nouveautés de cette version"
              aria-expanded="false" aria-controls="version-popover">i</button>
    </div>
    <div class="version-popover" id="version-popover" role="dialog" aria-labelledby="version-title" hidden>
      <h3 id="version-title">Nouveautés</h3>
      <span class="version-date" id="version-date" hidden></span>
      <ul id="version-notes"></ul>
    </div>
  </footer>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
