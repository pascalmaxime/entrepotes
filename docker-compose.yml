# Lancement en prod (sur le NUC) :  docker compose up -d --build
# Mise à jour après un git pull :    docker compose up -d --build
# Lien public à envoyer aux potes :  ./scripts/lien-public.sh
# Logs en direct :                   docker compose logs -f

services:
  entrepotes:
    build: .
    image: entrepotes:latest
    container_name: entrepotes
    restart: unless-stopped
    # Identifiants admin, ADMIN_LOCAL_ONLY… (fichier .env à côté de ce fichier, jamais sur Git)
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      MEMES_DIR: /app/data/memes
    ports:
      # Port côté NUC configurable avec GAME_PORT dans .env (3000 par défaut).
      - "${GAME_PORT:-3000}:3000"
    volumes:
      # Les images Top Meme survivent aux mises à jour et aux redémarrages.
      - memes-data:/app/data/memes
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Cloudflare Tunnel : rend le jeu accessible depuis Internet (lien https://…trycloudflare.com)
  # sans ouvrir de port sur la box. Le lien change seulement si ce conteneur redémarre
  # (reboot du NUC…) : ./scripts/lien-public.sh affiche toujours le lien actuel.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: entrepotes-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://entrepotes:3000
    depends_on:
      entrepotes:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  memes-data:
